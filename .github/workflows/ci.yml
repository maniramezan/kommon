name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches, but never on main: a cancelled main run reports
  # conclusion != success, which would skip the post-CI release workflow and stall a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The Gradle daemon is pinned to JDK 21 (gradle/gradle-daemon-jvm.properties);
          # Robolectric instrumenting against SDK 36 also requires it.
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: reports
          path: '**/build/reports/**'

  # API docs build in parallel with check instead of after it on the same runner.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build API docs
        run: ./gradlew dokkaGenerate

      # docs.yml downloads this artifact from the successful main CI run.
      - name: Upload API docs for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-site
          path: build/dokka/html/
          if-no-files-found: error

  # Branch protection requires a check named "build"; this gate keeps that name while the
  # real work runs in parallel jobs.
  build:
    runs-on: ubuntu-latest
    needs: [check, docs]
    if: always()
    steps:
      - name: Require check and docs to succeed
        run: |
          [ "${{ needs.check.result }}" = success ] && [ "${{ needs.docs.result }}" = success ]
